<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}GCSSHG{% endblock %}</title>
<style>
  :root {
    --green: #1a6b3c;
    --green-dark: #124d2b;
    --bg: #f4f6f5;
    --card: #ffffff;
    --text: #1f2a24;
    --muted: #667169;
    --border: #dfe6e1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--green);
    color: white;
    padding: 1rem 1.25rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header a { color: white; text-decoration: none; font-size: 0.9rem; opacity: 0.9; }
  header .brand { font-weight: 700; font-size: 1.05rem; }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 1.25rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.1rem;
    margin-bottom: 1rem;
  }
  h1, h2, h3 { margin-top: 0; }
  h2 { font-size: 1.1rem; color: var(--green-dark); }
  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  th, td { text-align: left; padding: 0.45rem 0.3rem; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 0.82rem; text-transform: uppercase; }
  .muted { color: var(--muted); font-size: 0.85rem; }
  .total { font-size: 1.6rem; font-weight: 700; color: var(--green-dark); }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin: 0.6rem 0 0.25rem; }
  input, select {
    width: 100%; padding: 0.55rem; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem;
  }
  button {
    margin-top: 0.9rem;
    background: var(--green);
    color: white;
    border: none;
    padding: 0.65rem 1rem;
    border-radius: 6px;
    font-size: 0.95rem;
    cursor: pointer;
    width: 100%;
  }
  button:hover { background: var(--green-dark); }
  .error {
    background: #fdeceb; color: #a33a2f; border: 1px solid #f3c6c1;
    padding: 0.6rem 0.8rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem;
  }
  .row-link { color: var(--green-dark); text-decoration: none; font-weight: 600; font-size: 0.85rem; }
  .status-active { color: var(--green-dark); font-weight: 600; }
  .badge { display:inline-block; padding: 0.15rem 0.5rem; border-radius: 20px; font-size: 0.75rem; font-weight:600; }
  .badge-low { background:#eaf4ee; color: var(--green-dark); }
  .badge-high { background:#fff2e0; color:#a85e00; }
</style>
</head>
<body>
<header>
  <span class="brand">GCSSHG</span>
  {% block header_right %}{% endblock %}
</header>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
