<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}GCSSHG{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1F4D3D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GCSSHG">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    --paper: #F6F5F1;
    --surface: #FFFFFF;
    --ink: #17231C;
    --forest: #1F4D3D;
    --forest-dark: #143229;
    --gold: #C08829;
    --gold-soft: #F3E4C6;
    --muted: #6B7A72;
    --border: #E1E4DE;
    --red: #A33A2F;
    --red-soft: #FBECEA;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    background: var(--paper);
    color: var(--ink);
  }
  h1, h2, h3, .display {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .figure {
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  header.topbar {
    background: var(--forest);
    color: #EFEFE8;
    padding: 0.9rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header.topbar .brand {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.15rem;
    letter-spacing: -0.01em;
  }
  header.topbar .brand span { color: var(--gold); }
  header.topbar nav a {
    color: #DCE6E0;
    text-decoration: none;
    font-size: 0.85rem;
    margin-left: 1.1rem;
  }
  header.topbar nav a:hover { color: white; }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 1.5rem;
  }
  main.narrow { max-width: 520px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px dashed var(--border);
    border-radius: 8px;
    padding: 1.15rem 1.25rem;
    margin-bottom: 1.1rem;
    position: relative;
  }
  .card h2 {
    font-size: 1rem;
    color: var(--forest-dark);
    margin: 0 0 0.7rem;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.9rem;
    margin-bottom: 1.1rem;
  }
  @media (min-width: 640px) {
    .stat-grid { grid-template-columns: repeat(4, 1fr); }
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px dashed var(--border);
    border-radius: 8px;
    padding: 1rem 1.1rem 1.1rem;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .stat-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(20, 50, 41, 0.12);
  }
  .card {
    transition: box-shadow 0.15s ease;
  }
  .card:hover {
    box-shadow: 0 4px 14px rgba(20, 50, 41, 0.06);
  }

  /* Solid-color card variants for a livelier dashboard */
  .stat-card.solid-forest { background: var(--forest); border: none; }
  .stat-card.solid-forest .stat-label { color: rgba(255,255,255,0.75); }
  .stat-card.solid-forest .stat-value { color: white; }
  .stat-card.solid-forest .stat-stamp { border-color: rgba(255,255,255,0.55); color: white; }

  .stat-card.solid-gold { background: var(--gold); border: none; }
  .stat-card.solid-gold .stat-label { color: rgba(255,255,255,0.85); }
  .stat-card.solid-gold .stat-value { color: white; }
  .stat-card.solid-gold .stat-stamp { border-color: rgba(255,255,255,0.7); color: white; }

  .stat-card.solid-teal { background: #2D6E8E; border: none; }
  .stat-card.solid-teal .stat-label { color: rgba(255,255,255,0.8); }
  .stat-card.solid-teal .stat-value { color: white; }
  .stat-card.solid-teal .stat-stamp { border-color: rgba(255,255,255,0.6); color: white; }

  .stat-card.solid-red { background: var(--red); border: none; }
  .stat-card.solid-red .stat-label { color: rgba(255,255,255,0.85); }
  .stat-card.solid-red .stat-value { color: white; }
  .stat-card.solid-red .stat-stamp { border-color: rgba(255,255,255,0.7); color: white; }

  .greeting-banner {
    background: linear-gradient(120deg, var(--forest), var(--forest-dark));
    color: white;
    border-radius: 10px;
    padding: 1.1rem 1.3rem;
    margin-bottom: 1.1rem;
  }
  .greeting-banner h1 { color: white; margin: 0 0 0.2rem; font-size: 1.3rem; }
  .greeting-banner p { color: rgba(255,255,255,0.8); margin: 0; font-size: 0.88rem; }

  .role-badge {
    display: inline-block; padding: 0.15rem 0.55rem; border-radius: 20px;
    font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
  }
  .role-chairperson { background: var(--gold-soft); color: #8a611d; }
  .role-treasurer { background: #dceee4; color: var(--forest-dark); }
  .role-secretary { background: #e3ecf5; color: #2D6E8E; }

  .stat-stamp {
    position: absolute;
    top: 0.7rem;
    right: 0.7rem;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1.5px solid var(--gold);
    color: var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-weight: 600;
    transform: rotate(-8deg);
    opacity: 0.85;
  }
  .stat-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 0.4rem;
  }
  .stat-value {
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--forest-dark);
    line-height: 1.15;
  }
  .stat-value.gold { color: var(--gold); }

  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  th, td { text-align: left; padding: 0.5rem 0.35rem; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }
  td.figure { text-align: right; }
  th.figure-head { text-align: right; }

  .muted { color: var(--muted); font-size: 0.85rem; }
  label { display: block; font-size: 0.82rem; color: var(--muted); margin: 0.6rem 0 0.25rem; font-weight: 500; }
  input, select {
    width: 100%; padding: 0.55rem 0.6rem; border: 1px solid var(--border); border-radius: 6px;
    font-size: 0.95rem; font-family: inherit; background: var(--surface); color: var(--ink);
  }
  input:focus, select:focus, button:focus, a:focus {
    outline: 2px solid var(--gold); outline-offset: 1px;
  }
  button, .btn {
    margin-top: 0.9rem;
    background: var(--forest);
    color: white;
    border: none;
    padding: 0.65rem 1rem;
    border-radius: 6px;
    font-size: 0.92rem;
    font-weight: 500;
    cursor: pointer;
    width: 100%;
    text-align: center;
    text-decoration: none;
    display: inline-block;
  }
  button:hover, .btn:hover { background: var(--forest-dark); }
  .btn-secondary {
    background: transparent;
    color: var(--forest-dark);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: var(--gold-soft); border-color: var(--gold); }

  .error {
    background: var(--red-soft); color: var(--red); border: 1px solid #f3c6c1;
    padding: 0.6rem 0.8rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem;
  }
  .row-link { color: var(--forest-dark); text-decoration: none; font-weight: 600; font-size: 0.85rem; }
  .row-link:hover { color: var(--gold); }
  .status-active { color: var(--forest-dark); font-weight: 600; }
  .badge { display:inline-block; padding: 0.15rem 0.55rem; border-radius: 20px; font-size: 0.72rem; font-weight:600; }
  .badge-low { background: var(--gold-soft); color: #8a611d; }
  .badge-high { background: #fff2e0; color:#a85e00; }
  .actions-row { display: flex; gap: 0.6rem; margin-top: 0.6rem; }
  .actions-row .btn { margin-top: 0; }
  .section-title { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.8rem; }
  .section-title h2 { margin: 0; }
  .chart-wrap { position: relative; height: 220px; }
  .chart-grid { display: grid; grid-template-columns: 1fr; gap: 1.1rem; margin-bottom: 1.1rem; }
  @media (min-width: 640px) {
    .chart-grid { grid-template-columns: 1.4fr 1fr; }
  }

  .letterhead {
    display: flex; align-items: center; gap: 0.9rem;
    padding-bottom: 0.9rem; margin-bottom: 1.1rem;
    border-bottom: 2px solid var(--forest);
  }
  .letterhead-logo { width: 56px; height: 56px; flex-shrink: 0; }
  .letterhead-title { font-family: 'Fraunces', serif; font-weight: 700; font-size: 1.05rem; color: var(--forest-dark); }
  .letterhead-sub { font-size: 0.78rem; color: var(--muted); margin-top: 0.15rem; }

  @media print {
    header.topbar, nav, .no-print, form, button:not(.keep-print) { display: none !important; }
    body { background: white; }
    main { max-width: 100%; padding: 0; }
    .card { border: 1px solid #ccc; border-left: 1px solid #ccc; box-shadow: none; break-inside: avoid; }
    a { text-decoration: none; color: inherit; }
    .stat-stamp { display: none; }
  }
</style>
</head>
<body>
<header class="topbar">
  <span class="brand"><img src="/static/logo.svg" alt="GCSSHG" style="height:32px; width:32px; vertical-align:middle; margin-right:0.5rem; border-radius:50%;">GCSSHG <span>ledger</span></span>
  {% block header_right %}{% endblock %}
</header>
<main class="{% block main_class %}{% endblock %}">
  {% block content %}{% endblock %}
</main>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch((err) => console.error('SW registration failed:', err));
    });
  }
</script>
</body>
</html>
