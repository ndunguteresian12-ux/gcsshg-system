<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <path id="arcTop" d="M 22,128 A 98,98 0 0 1 218,128" />
    <path id="arcBottom" d="M 45,168 A 78,78 0 0 0 195,168" />
  </defs>

  <!-- outer ring -->
  <circle cx="120" cy="120" r="112" fill="none" stroke="#C08829" stroke-width="3"/>
  <circle cx="120" cy="120" r="104" fill="none" stroke="#C08829" stroke-width="1"/>

  <!-- main disc -->
  <circle cx="120" cy="120" r="100" fill="#1F4D3D"/>

  <!-- arced group name, top -->
  <text font-family="'IBM Plex Sans', Arial, sans-serif" font-size="9.5" font-weight="600"
        letter-spacing="1.3" fill="#F3E4C6">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">
      GITHIGA COMPREHENSIVE SCHOOL
    </textPath>
  </text>

  <!-- center motif: coin with symmetric sprouting leaves (savings + growth) -->
  <g transform="translate(120,110)">
    <ellipse cx="0" cy="20" rx="27" ry="9" fill="none" stroke="#F3E4C6" stroke-width="2.5"/>
    <path d="M -27,20 A 27,9 0 0 0 27,20 L 27,25 A 27,9 0 0 1 -27,25 Z" fill="#F3E4C6" opacity="0.9"/>
    <line x1="0" y1="11" x2="0" y2="-18" stroke="#F3E4C6" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 0,-18 C -6,-26 -20,-24 -22,-14 C -13,-13 -4,-13 0,-18 Z" fill="#F3E4C6"/>
    <path d="M 0,-10 C 6,-18 20,-16 22,-6 C 13,-5 4,-5 0,-10 Z" fill="#F3E4C6"/>
  </g>

  <!-- monogram -->
  <text x="120" y="150" font-family="'Fraunces', Georgia, serif" font-size="22" font-weight="700"
        fill="#F3E4C6" text-anchor="middle" letter-spacing="1">GCSSHG</text>

  <!-- arced tagline, bottom -->
  <text font-family="'IBM Plex Sans', Arial, sans-serif" font-size="10" font-weight="600"
        letter-spacing="2.5" fill="#C08829">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">
      SELF HELP GROUP
    </textPath>
  </text>
</svg>
